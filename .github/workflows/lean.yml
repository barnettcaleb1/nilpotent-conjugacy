name: Lean components

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - name: Check sources, build, and audit axioms
        run: python3 scripts/verify.py
